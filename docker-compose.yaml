services:
    postgres:
        image: postgres:15-alpine
        container_name: pipec-postgres
        environment:
            POSTGRES_DB: pipec
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: shasha
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d pipec']
            interval: 10s
            timeout: 5s
            retries: 5

    pipec-backend:
        build:
            context: ./backend
            dockerfile: DockerFile
        container_name: pipec-backend
        environment:
            DATABASE_URL: postgres://postgres:shasha@postgres:5432/pipec?sslmode=disable
            PIPEC_PORT: 1143
        ports:
            - '1143:1143'
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./backend:/app
        restart: unless-stopped

    websocket-proxy:
        build:
            context: ./proxy
            dockerfile: DockerFile
        container_name: pipec-proxy
        environment:
            PIPEC_HOST: pipec-backend
            PIPEC_PORT: 1143
            PROXY_PORT: 96
            HEALTH_PORT: 3001
        ports:
            - '96:96'
            - '3001:3001'
        depends_on:
            - pipec-backend
        volumes:
            - ./proxy:/app
        restart: unless-stopped

    nginx:
        image: nginx:alpine
        container_name: pipec-nginx
        ports:
            - '8080:80'
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./test-client.html:/usr/share/nginx/html/index.html
        depends_on:
            - websocket-proxy

volumes:
    postgres_data:
